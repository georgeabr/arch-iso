name: Build Arch Linux ISO with XFCE

on:
  workflow_dispatch:
    inputs:
      build_date:
        description: 'ISO build timestamp (YYYYMMDD_HHMMSS). Leave empty for current time.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      options: --privileged
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install archiso, tools & p7zip
        run: |
          pacman -Sy --noconfirm \
            archiso squashfs-tools xorriso dosfstools \
            p7zip curl util-linux binutils jq \
            gcc pkgconf readline

      - name: Prepare XFCE profile
        id: prepare_profile
        shell: bash
        run: |
          PROFILE=xfce-profile
          rm -rf "$PROFILE"
          cp -r /usr/share/archiso/configs/releng "$PROFILE"

          mkdir -p \
            "$PROFILE/airootfs/root" \
            "$PROFILE/airootfs/etc/lightdm" \
            "$PROFILE/airootfs/etc/systemd/system/multi-user.target.wants"

          for pkg in \
            xfce4 xfce4-goodies xorg-server xorg-xinit \
            lightdm lightdm-gtk-greeter networkmanager \
            firefox htop iotop gparted network-manager-applet \
            ncdu sbctl
          do
            echo "$pkg" >> "$PROFILE/packages.x86_64"
          done

          # Enable NetworkManager service on boot
          ln -s /usr/lib/systemd/system/NetworkManager.service \
            "$PROFILE/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service"

          # Create nm-applet autostart file with echo
          mkdir -p "$PROFILE/airootfs/root/.config/autostart"
          AUTOSTART="$PROFILE/airootfs/root/.config/autostart/nm-applet.desktop"
          echo '[Desktop Entry]'                           > "$AUTOSTART"
          echo 'Type=Application'                         >> "$AUTOSTART"
          echo 'Name=Network Manager Applet'              >> "$AUTOSTART"
          echo 'Exec=nm-applet --indicator'               >> "$AUTOSTART"
          echo 'OnlyShowIn=XFCE;'                         >> "$AUTOSTART"
          echo 'Terminal=false'                           >> "$AUTOSTART"
          echo 'X-GNOME-Autostart-enabled=true'           >> "$AUTOSTART"

          sed -i \
            -e 's/^iso_name=.*/iso_name="archlinux-xfce"/' \
            -e 's/^iso_label=.*/iso_label="ARCH_XFCE"/' \
            "$PROFILE/profiledef.sh"

          # --- START OF ZSTD COMPRESSION MODIFICATIONS (Broken Down) ---
          # Step 1: Change the compression algorithm from 'xz' to 'zstd'
          # and explicitly set a faster compression level (e.g., 3).
          # This replaces '-comp' 'xz' with '-comp' 'zstd' '-Xcompression-level' '5'.
          # We use '|' as the sed delimiter to avoid issues with '/' in file paths or text.
          sed -i "s|'-comp' 'xz'|'-comp' 'zstd' '-Xcompression-level' '5'|" "$PROFILE/profiledef.sh"

          # Step 2: Remove the xz-specific BCJ filter.
          # This removes the '-Xbcj' 'x86' part which is not used by zstd.
          sed -i "s|'-Xbcj' 'x86'||" "$PROFILE/profiledef.sh"

          # Step 3: Remove the xz-specific dictionary size option.
          # This removes the '-Xdict-size' '1M' part which is also not used by zstd.
          sed -i "s|'-Xdict-size' '1M'||" "$PROFILE/profiledef.sh"
          # --- END OF ZSTD COMPRESSION MODIFICATIONS (Broken Down) ---

          # Force /root/arch.sh, /root/eficlean.sh and /usr/local/bin/diskviz permissions at
          # pack time. mkarchiso applies the file_permissions array
          # authoritatively when building the squashfs (part of its
          # reproducible-build normalisation pass), which resets any chmod
          # done on disk for paths not explicitly listed here.
          sed -i '/file_permissions=(/a\  ["/root/arch.sh"]="0:0:755"\n  ["/root/eficlean.sh"]="0:0:755"\n  ["/usr/local/bin/diskviz"]="0:0:755"' "$PROFILE/profiledef.sh"

          curl -fsSL \
            https://raw.githubusercontent.com/georgeabr/arch/refs/heads/master/arch.sh \
            -o "$PROFILE/airootfs/root/arch.sh"
          chmod +x "$PROFILE/airootfs/root/arch.sh"

          # Download eficlean
          curl -fsSL \
            https://raw.githubusercontent.com/georgeabr/arch/refs/heads/master/eficlean.sh \
            -o "$PROFILE/airootfs/root/eficlean.sh"
          chmod +x "$PROFILE/airootfs/root/eficlean.sh"

          # Ensure scripts stay executable on first login shell (TTY auto-login)
          echo 'chmod +x /root/arch.sh /root/eficlean.sh' \
            >> "$PROFILE/airootfs/root/.bash_profile"
          echo 'systemctl start NetworkManager.service' \
            >> "$PROFILE/airootfs/root/.bash_profile"

          BP="$PROFILE/airootfs/root/.bash_profile"
          echo "printf '\n\e[1;36m========================================================\e[0m\n'" >> "$BP"
          echo "printf '\e[1;36m   Arch Linux Live Environment\e[0m\n'" >> "$BP"
          echo "printf '\e[1;36m========================================================\e[0m\n\n'" >> "$BP"
          echo "printf '  \e[1;32mdiskviz\e[0m     - inspect and partition your disks\n'" >> "$BP"
          echo "printf '  \e[1;32m./arch.sh\e[0m   - start the Arch installation\n'" >> "$BP"
          echo "printf '  \e[1;32m./eficlean.sh\e[0m - manage EFI boot entries\n\n'" >> "$BP"
          echo "printf '  Tip: run \e[1;32mdiskviz\e[0m first if you need help partitioning,\n'" >> "$BP"
          echo "printf '       then run \e[1;32m./arch.sh\e[0m to begin.\n'" >> "$BP"
          echo "printf '\e[1;36m========================================================\e[0m\n\n'" >> "$BP"


          echo 'root:x:0:0:root:/root:/bin/bash' \
            > "$PROFILE/airootfs/etc/passwd"

          echo 'exec startxfce4' \
            > "$PROFILE/airootfs/root/.xinitrc"

          echo '[Seat:*]' \
            > "$PROFILE/airootfs/etc/lightdm/lightdm.conf"
          echo 'autologin-user=root' \
            >> "$PROFILE/airootfs/etc/lightdm/lightdm.conf"
          echo 'autologin-session=xfce' \
            >> "$PROFILE/airootfs/etc/lightdm/lightdm.conf"

          # Set console keymap & font
          mkdir -p "$PROFILE/airootfs/etc"
          echo "KEYMAP=uk"    > "$PROFILE/airootfs/etc/vconsole.conf"
          echo "XKBLAYOUT=gb" >> "$PROFILE/airootfs/etc/vconsole.conf"
          echo "FONT=ter-922b" >> "$PROFILE/airootfs/etc/vconsole.conf"

          # Enable NetworkManager applet autostart in XFCE
          mkdir -p "$PROFILE/airootfs/root/.config/autostart"

          # ────────────────────────────────────────────────
          # Create pacman hook to strip nvidia & mrvl firmware
          mkdir -p "$PROFILE/airootfs/etc/pacman.d/hooks"
          HOOK_FILE="$PROFILE/airootfs/etc/pacman.d/hooks/remove-unneeded-fw.hook"

          echo '[Trigger]'                                                        >  "$HOOK_FILE"
          echo 'Operation = Install'                                              >> "$HOOK_FILE"
          echo 'Type = Package'                                                   >> "$HOOK_FILE"
          echo 'Target = linux-firmware'                                          >> "$HOOK_FILE"
          echo                                                                     >> "$HOOK_FILE"
          echo '[Action]'                                                         >> "$HOOK_FILE"
          echo 'Description = Remove unneeded firmware directories'               >> "$HOOK_FILE"
          echo 'When = PostTransaction'                                           >> "$HOOK_FILE"
          echo 'Exec = /usr/bin/rm -rf /usr/lib/firmware/nvidia /usr/lib/firmware/mrvl' \
            >> "$HOOK_FILE"
          # ────────────────────────────────────────────────

          echo "profile_dir=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Verify profiledef.sh contents
        shell: bash
        run: |
          echo "--- Contents of ${{ steps.prepare_profile.outputs.profile_dir }}/profiledef.sh ---"
          cat "${{ steps.prepare_profile.outputs.profile_dir }}/profiledef.sh"
          echo "---------------------------------------------------------"

      - name: Build diskviz binary
        id: build_diskviz
        shell: bash
        run: |
          PROFILE="${{ steps.prepare_profile.outputs.profile_dir }}"
          BIN_DIR="$PROFILE/airootfs/usr/local/bin"
          mkdir -p "$BIN_DIR"

          curl -fsSL \
            https://raw.githubusercontent.com/georgeabr/systems-programming/refs/heads/main/diskviz/diskviz.c \
            -o diskviz.c

          gcc -O2 -Wall $(pkg-config --cflags --libs fdisk blkid) -lreadline \
            -o "$BIN_DIR/diskviz" diskviz.c

          chmod +x "$BIN_DIR/diskviz"
          echo "diskviz_path=$BIN_DIR/diskviz" >> "$GITHUB_OUTPUT"

      - name: Verify diskviz binary
        shell: bash
        run: |
          echo "--- diskviz binary details ---"
          ls -lha "${{ steps.build_diskviz.outputs.diskviz_path }}"
          file "${{ steps.build_diskviz.outputs.diskviz_path }}"
          echo "-------------------------------"

      - name: Determine build timestamp
        id: ts
        shell: bash
        run: |
          BUILD_TS="${{ github.event.inputs.build_date }}"
          [ -z "$BUILD_TS" ] && BUILD_TS=$(date '+%Y%m%d_%H%M%S')
          echo "build_timestamp=$BUILD_TS" >> "$GITHUB_OUTPUT"

      - name: Build the ISO
        id: build_iso
        shell: bash
        run: |
          OUT=out
          mkarchiso -v -o "$OUT" "${{ steps.prepare_profile.outputs.profile_dir }}"
          ISO=$(find "$OUT" -maxdepth 1 -type f -name '*.iso' -print -quit)
          [ -z "$ISO" ] && { echo "ERROR: ISO not found!" >&2; exit 1; }
          echo "iso_path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Verify arch.sh, eficlean.sh and diskviz permissions inside squashfs
        shell: bash
        run: |
          # mkarchiso builds airootfs.sfs inside its work directory (default
          # ./work, since we don't pass -w) BEFORE xorriso packs it into the
          # ISO. That work dir isn't removed unless -r/--clean is passed, so
          # the squashfs is on disk under the workspace root, not under out/.
          SQFS=$(find . -type f -name 'airootfs.sfs' -print -quit)
          [ -z "$SQFS" ] && { echo "ERROR: airootfs.sfs not found anywhere in the workspace!" >&2; exit 1; }
          echo "Found squashfs: $SQFS"

          EXTRACT_DIR=$(mktemp -d)
          unsquashfs -d "$EXTRACT_DIR/extracted" "$SQFS" root/arch.sh root/eficlean.sh usr/local/bin/diskviz

          echo "--- arch.sh permissions as packed inside the squashfs ---"
          ls -lha "$EXTRACT_DIR/extracted/root/arch.sh"
          file "$EXTRACT_DIR/extracted/root/arch.sh"

          echo "--- eficlean.sh permissions as packed inside the squashfs ---"
          ls -lha "$EXTRACT_DIR/extracted/root/eficlean.sh"
          file "$EXTRACT_DIR/extracted/root/eficlean.sh"

          echo "--- diskviz permissions as packed inside the squashfs ---"
          ls -lha "$EXTRACT_DIR/extracted/usr/local/bin/diskviz"
          file "$EXTRACT_DIR/extracted/usr/local/bin/diskviz"
          echo "-----------------------------------------------------------"

          [ -x "$EXTRACT_DIR/extracted/root/arch.sh" ] || {
            echo "ERROR: arch.sh is not executable inside the squashfs!" >&2
            exit 1
          }
          [ -x "$EXTRACT_DIR/extracted/root/eficlean.sh" ] || {
            echo "ERROR: eficlean.sh is not executable inside the squashfs!" >&2
            exit 1
          }
          [ -x "$EXTRACT_DIR/extracted/usr/local/bin/diskviz" ] || {
            echo "ERROR: diskviz is not executable inside the squashfs!" >&2
            exit 1
          }

          rm -rf "$EXTRACT_DIR"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: archlinux-xfce-iso-${{ steps.ts.outputs.build_timestamp }}
          path: ${{ steps.build_iso.outputs.iso_path }}

      - name: Fetch latest kernel version from Arch repo
        id: fetch_kernel
        shell: bash
        run: |
          PKG_JSON=$(curl -fsSL 'https://archlinux.org/packages/core/x86_64/linux/json/')
          PKGVER=$(echo "$PKG_JSON" | jq -r '.pkgver')
          PKGREL=$(echo "$PKG_JSON" | jq -r '.pkgrel')
          echo "KERNEL_VERSION_REPO=${PKGVER}-${PKGREL}" >> "$GITHUB_OUTPUT"


      - name: Create GitHub Release (Optional)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.build_iso.outputs.iso_path }}
          tag_name: "iso-${{ steps.ts.outputs.build_timestamp }}"
          name: "Arch Linux XFCE ISO ${{ steps.ts.outputs.build_timestamp }}"
          body: |
            ### Build Information
            - **Profile**: `xfce-profile` built on `${{ steps.ts.outputs.build_timestamp }}`.
            - **Kernel**: `${{ steps.fetch_kernel.outputs.KERNEL_VERSION_REPO }}` (Nvidia/Marvell firmware removed).
            - **Packages**: Includes `xfce4`, `xfce4-goodies`, `firefox`, `htop`, `iotop`, `mc`, `gparted`, `ncdu`, and `sbctl` (`mc` via the releng base profile this is built from).
            - **Custom tools**: 
              - `diskviz` (disk partitioning helper) compiled from [georgeabr/systems-programming](https://github.com/georgeabr/systems-programming/blob/main/diskviz/diskviz.c) and installed to `/usr/local/bin`.
              - `eficlean` (EFI boot entry manager) from [georgeabr/arch](https://github.com/georgeabr/arch/blob/master/eficlean.sh) and installed to `/root`.

            ### Usage Instructions
            - **Environment**: Root shell is `/bin/bash`; installer at `/root/arch.sh`, boot manager at `/root/eficlean.sh`.
            - **On login**: a banner is shown pointing to `diskviz` (for partitioning), `./arch.sh` (to start the install), and `./eficlean.sh` (to manage EFI boot entries).
            - **Commands**: Run `diskviz` first if you need help partitioning, `./eficlean.sh` to clean up boot entries, then `./arch.sh` to begin installation, or `startx` for XFCE.
            - **Logging**: All sessions are logged to a timestamped `.log` file.
            - **Note**: `trizen` is not on this ISO — it's installed by `arch-2.sh` from a compiled package.
          prerelease: false
